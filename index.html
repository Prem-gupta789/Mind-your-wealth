<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind Your Wealth</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
    body{background:#0b0b0b;color:#fff}
    nav{display:flex;justify-content:space-between;align-items:center;padding:20px 8%;position:sticky;top:0;background:#111;z-index:10}
    .logo{font-size:28px;font-weight:700;color:#FFD700}
    nav a{color:#fff;text-decoration:none;margin-left:25px}
    .hero{height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
    .hero h1{font-size:50px}
    .hero h1 span{color:#FFD700}
    .hero p{margin:20px 0;color:#bbb;max-width:650px}
    .btn{background:#FFD700;color:#111;padding:12px 30px;border-radius:50px;text-decoration:none;font-weight:700;display:inline-block}
    .products{padding:60px 8%}
    .products h2{text-align:center;font-size:36px;color:#FFD700;margin-bottom:40px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px}
    .card{background:#161616;padding:20px;border-radius:20px;display:flex;flex-direction:column;justify-content:space-between}
    .card img{width:100%;height:200px;object-fit:cover;border-radius:15px;margin-bottom:15px}
    .card h3{font-size:20px;margin-bottom:5px}
    .card p{color:#ccc;font-size:14px;margin-bottom:15px}
    .price{color:#FFD700;font-size:22px;font-weight:700;margin-bottom:15px}
    footer{text-align:center;padding:30px;color:#888}
  </style>
</head>
<body>

  <nav>
    <div class="logo">Mind Your Wealth</div>
    <div>
      <a href="#">Home</a>
      <a href="#shop">Shop</a>
      <a href="/admin/">Admin</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Upgrade Your <span>Health & Wealth</span></h1>
    <p>Top quality fitness gear and nutrition curated just for you.</p>
    <a href="#shop" class="btn">Explore Shop</a>
  </section>

  <section class="products" id="shop">
    <h2>Featured Products</h2>
    <div class="grid" id="product-grid">
      <p style="text-align:center; grid-column: 1/-1;">Loading products...</p>
    </div>
  </section>

  <footer>
    <p>© 2026 Mind Your Wealth. All rights reserved.</p>
  </footer>

  <!-- GitHub API Se CMS Products Fetch Karne Ka Script -->
  <script>
    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      const repo = 'Prem-gupta789/Mind-your-wealth';
      
      try {
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/products`);
        if (!response.ok) throw new Error('No products folder found');
        
        const files = await response.json();
        grid.innerHTML = ''; // Clear loading text

        for (let file of files) {
          if (file.name.endsWith('.md')) {
            const rawRes = await fetch(file.download_url);
            const content = await rawRes.text();

            // Simple Frontmatter Parser (Extract YAML metadata)
            const titleMatch = content.match(/title:\s*"?([^"\n]+)"?/);
            const priceMatch = content.match(/price:\s*"?([^"\n]+)"?/);
            const imageMatch = content.match(/image:\s*"?([^"\n]+)"?/);
            const linkMatch = content.match(/buy_link:\s*"?([^"\n]+)"?/);

            const title = titleMatch ? titleMatch[1] : 'Product';
            const price = priceMatch ? priceMatch[1] : '';
            const image = imageMatch ? imageMatch[1] : 'https://via.placeholder.com/200';
            const buyLink = linkMatch ? linkMatch[1] : '#';

            grid.innerHTML += `
              <div class="card">
                <div>
                  <img src="${image}" alt="${title}">
                  <h3>${title}</h3>
                  <p class="price">${price}</p>
                </div>
                <a href="${buyLink}" target="_blank" class="btn">Buy Now</a>
              </div>
            `;
          }
        }
      } catch (err) {
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No products added yet. Add some from /admin!</p>';
      }
    }

    loadProducts();
  </script>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

</body>
</html>
